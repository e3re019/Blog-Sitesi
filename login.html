<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - e3re_0</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stars"></div>

<header class="navbar">
    <div class="nav-left"><span class="logo">e3re_0</span></div>
    <div class="nav-center">
        <a href="index.html">Ana Sayfa</a>
        <a href="donate.html">Bağış</a>
    </div>
    <div class="nav-right">
        <a href="register.html" style="color: #fff; text-decoration: none; font-weight: bold;">Kayıt Ol</a>
    </div>
</header>

<section class="center" style="min-height: calc(100vh - 140px); display: flex; justify-content: center; align-items: center;">
    <div class="card" style="width: 100%; max-width: 400px; text-align: center;">
        <h2>Giriş Yap</h2>
        <form id="loginForm" style="display: flex; flex-direction: column; gap: 15px; margin-top: 15px;">
            <input type="text" id="loginUser" placeholder="Kullanıcı Adı" required style="padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;">
            <input type="password" id="loginPass" placeholder="Şifre" required style="padding: 10px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px;">
            <button type="submit" style="padding: 10px; background: #00adb5; color: #fff; border: none; border-radius: 4px; font-weight: bold; cursor: pointer;">Giriş Yap</button>
        </form>
        <p style="margin-top: 15px; font-size: 14px; color: #aaa;">Hesabın yok mu? <a href="register.html" style="color: #00adb5; text-decoration: none; font-weight: bold;">Kayıt Ol</a></p>
        <p id="msg" style="margin-top: 15px; font-size: 14px; display: none; font-weight: bold;"></p>
    </div>
</section>

<footer>© 2026 Tüm Hakları Saklıdır</footer>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const username = document.getElementById("loginUser").value.trim();
    const password = document.getElementById("loginPass").value.trim();
    const msg = document.getElementById("msg");

    try {
        const response = await fetch("/api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });
        const data = await response.json();
        
        msg.style.display = "block";
        if (response.ok) {
            msg.style.color = "#00ff88";
            msg.textContent = "Giriş başarılı! Yönlendiriliyorsunuz...";
            localStorage.setItem("username", data.user);
            setTimeout(() => { window.location.href = "index.html"; }, 1000);
        } else {
            msg.style.color = "#ff4a4a";
            msg.textContent = data.message;
        }
    } catch {
        msg.style.display = "block";
        msg.style.color = "#ff4a4a";
        msg.textContent = "Sunucu bağlantı hatası.";
    }
});
</script>
</body>
</html>
